spring:
  application:
    name: pointly
  profiles:
    active: local
  datasource:
    name: PointlyDataSource
    url: jdbc:mysql://mysql:3306/pointly?characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: application
    password: application
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

toss:
  secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
  api:
    url:
      confirm: api.tosspayments.com/v1/payments/confirm

